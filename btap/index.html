<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        tr:hover { background-color: #f1f1f1; cursor: pointer; }
        .img-thumb { width: 50px; height: 50px; object-fit: cover; }
    </style>
</head>
<body class="p-4">

<div class="container-fluid">
    <h2 class="mb-3">📦 Bảng điều khiển sản phẩm</h2>

    <!-- Khu vực điều khiển -->
    <div class="row mb-3">
        <div class="col-md-3">
            <input class="form-control" placeholder="🔍 Tìm kiếm theo tên sản phẩm..." oninput="searchTitle(this.value)">
        </div>

        <div class="col-md-2">
            <select class="form-select" onchange="changeLimit(this.value)">
                <option value="5">5 sản phẩm / trang</option>
                <option value="10" selected>10 sản phẩm / trang</option>
                <option value="20">20 sản phẩm / trang</option>
            </select>
        </div>

        <div class="col-md-2">
            <button class="btn btn-success" onclick="exportCSV()">⬇ Xuất file CSV</button>
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
                ➕ Thêm sản phẩm
            </button>
        </div>
    </div>

    <!-- Bảng dữ liệu -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th onclick="sortBy('title')">Tên sản phẩm ⬍</th>
                <th onclick="sortBy('price')">Giá ⬍</th>
                <th>Danh mục</th>
                <th>Hình ảnh</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <!-- Phân trang -->
    <div class="d-flex justify-content-between">
        <button class="btn btn-secondary" onclick="prevPage()">⬅ Trang trước</button>
        <span>Trang <span id="page"></span></span>
        <button class="btn btn-secondary" onclick="nextPage()">Trang sau ➡</button>
    </div>
</div>

<!-- MODAL XEM / SỬA -->
<div class="modal fade" id="detailModal">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header">
    <h5 class="modal-title">Chi tiết sản phẩm</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <input type="hidden" id="editId">
    <div class="mb-2">
        <label>Tên sản phẩm</label>
        <input class="form-control" id="editTitle">
    </div>
    <div class="mb-2">
        <label>Giá</label>
        <input type="number" class="form-control" id="editPrice">
    </div>
    <div class="mb-2">
        <label>Mô tả</label>
        <textarea class="form-control" id="editDescription"></textarea>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-warning" onclick="updateProduct()">💾 Cập nhật</button>
</div>
</div>
</div>
</div>

<!-- MODAL THÊM MỚI -->
<div class="modal fade" id="createModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
    <h5>Thêm sản phẩm mới</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <input class="form-control mb-2" placeholder="Tên sản phẩm" id="cTitle">
    <input class="form-control mb-2" placeholder="Giá" id="cPrice">
    <textarea class="form-control mb-2" placeholder="Mô tả" id="cDescription"></textarea>
    <input class="form-control mb-2" placeholder="URL hình ảnh" id="cImage">
</div>
<div class="modal-footer">
    <button class="btn btn-success" onclick="createProduct()">Tạo mới</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = 'https://api.escuelajs.co/api/v1/products';

let products = [];
let filtered = [];
let page = 1;
let limit = 10;
let sortField = '';
let asc = true;

async function loadData() {
    const res = await fetch(API);
    products = await res.json();
    filtered = [...products];
    render();
}

function render() {
    const start = (page - 1) * limit;
    const data = filtered.slice(start, start + limit);

    document.getElementById('tbody').innerHTML = data.map(p => `
        <tr title="${p.description}" onclick="openDetail(${p.id})">
            <td>${p.id}</td>
            <td>${p.title}</td>
            <td>${p.price} $</td>
            <td>${p.category?.name || ''}</td>
            <td><img src="${p.images[0]}" class="img-thumb"></td>
        </tr>
    `).join('');

    document.getElementById('page').innerText = page;
}

function searchTitle(val) {
    filtered = products.filter(p =>
        p.title.toLowerCase().includes(val.toLowerCase())
    );
    page = 1;
    render();
}

function changeLimit(val) {
    limit = +val;
    page = 1;
    render();
}

function sortBy(field) {
    asc = sortField === field ? !asc : true;
    sortField = field;
    filtered.sort((a,b) =>
        asc ? a[field] > b[field] : a[field] < b[field]
    );
    render();
}

function prevPage() {
    if (page > 1) page--;
    render();
}

function nextPage() {
    if (page * limit < filtered.length) page++;
    render();
}

function exportCSV() {
    let csv = "id,ten_san_pham,gia\n";
    filtered.slice((page-1)*limit, page*limit)
        .forEach(p => csv += `${p.id},${p.title},${p.price}\n`);

    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'san_pham.csv';
    a.click();
}

async function openDetail(id) {
    const p = products.find(x => x.id === id);
    editId.value = p.id;
    editTitle.value = p.title;
    editPrice.value = p.price;
    editDescription.value = p.description;
    new bootstrap.Modal(detailModal).show();
}

async function updateProduct() {
    await fetch(`${API}/${editId.value}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            title: editTitle.value,
            price: editPrice.value,
            description: editDescription.value
        })
    });
    alert('Cập nhật sản phẩm thành công!');
    loadData();
}

async function createProduct() {
    await fetch(API, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            title: cTitle.value,
            price: cPrice.value,
            description: cDescription.value,
            categoryId: 1,
            images: [cImage.value]
        })
    });
    alert('Thêm sản phẩm thành công!');
    loadData();
}

loadData();
</script>
</body>
</html>
